# The EC2 test deploy: Postgres + the API + Caddy, all one unit so nothing
# has to be wired together across separate compose files. Caddy handles
# HTTPS automatically via Let's Encrypt - no manual certbot/nginx config.
#
# Usage on the instance:
#   1. Edit Caddyfile - set it to your real domain (e.g. api.krova.space)
#   2. Create a .env file here with JWT_SECRET / ENCRYPTION_KEY /
#      META_INSTAGRAM_APP_ID / META_INSTAGRAM_APP_SECRET / META_WEBHOOK_VERIFY_TOKEN
#      (DATABASE_URL is set below already, pointing at the postgres service -
#      no need to add it to .env)
#   3. docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:18-alpine
    container_name: krova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krova
      POSTGRES_PASSWORD: krova_prod_test
      POSTGRES_DB: krova
    volumes:
      - krova_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krova -d krova"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: krova-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://krova:krova_prod_test@postgres:5432/krova
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  # Background job workers - each is meant to run as its own long-lived
  # process (services/*/worker_runner.py's run_worker_process, an infinite
  # claim-work-repeat loop), not something the API process does inline. Left
  # out of this compose file entirely at first: the API alone looked
  # complete (it serves every route, including sending replies a human
  # approves), so jobs quietly piled up in the `jobs` table - drafts,
  # analysis, profile compression - with nothing ever claiming them. No
  # error anywhere, because an unconsumed queue does not look broken, it
  # looks idle.
  #
  # -m services.workers.X, not services/workers/X.py: the module form runs
  # with /app (this container's WORKDIR) on sys.path, so `from shared...`
  # resolves; the script form only adds the script's own directory
  # (/app/services/workers) and fails with ModuleNotFoundError - confirmed
  # directly, not assumed, before writing this.
  worker-respond:
    build: .
    container_name: krova-worker-respond
    restart: unless-stopped
    command: ["python", "-m", "services.workers.respond"]
    environment:
      DATABASE_URL: postgresql+asyncpg://krova:krova_prod_test@postgres:5432/krova
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  worker-analyse:
    build: .
    container_name: krova-worker-analyse
    restart: unless-stopped
    command: ["python", "-m", "services.workers.analyse"]
    environment:
      DATABASE_URL: postgresql+asyncpg://krova:krova_prod_test@postgres:5432/krova
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  worker-profile:
    build: .
    container_name: krova-worker-profile
    restart: unless-stopped
    command: ["python", "-m", "services.workers.profile"]
    environment:
      DATABASE_URL: postgresql+asyncpg://krova:krova_prod_test@postgres:5432/krova
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: krova-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  krova_pgdata:
  caddy_data:
  caddy_config:
